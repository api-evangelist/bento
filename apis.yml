name: Bento
description: 'Bento (Bento Technologies, Inc., dba Bento for Business) was a Chicago-
  and San Francisco-based small-business fintech that provided card-based payment and
  expense management for small and mid-size businesses: virtual and physical employee
  and utility cards, per-card spend controls and category restrictions, real-time spend
  tracking, and accounting integrations. Bento published a public REST API at api.bentoforbusiness.com
  (documented at apidocs.bentoforbusiness.com) for issuing employee and utility virtual
  cards, retrieving card numbers, activating and customizing billing addresses, and
  reading card transactions, plus outbound webhooks for card transaction completed
  and declined events; API access was granted per account via an Access Key and Secret
  Key issued by api-support@bentoforbusiness.com. Bento raised a $2.5M seed round led
  by Anthemis Group in 2015, with Blumberg Capital, LionBird, Pivot Investment Partners,
  Edison Partners and Espresso Capital also investing. U.S. Bank agreed to acquire Bento
  Technologies on August 11, 2021 and closed the acquisition on August 31, 2021, folding
  the product into U.S. Bank''s small-business spend management offering. The Bento card
  program was then wound down: card reloads stopped April 30, 2024 and all card program
  services were discontinued June 25, 2024, with customers directed to alternative
  providers. The developer surface is retired — apidocs.bentoforbusiness.com and
  api.bentoforbusiness.com no longer resolve in DNS, and bentoforbusiness.com now
  redirects to U.S. Bank. This profile is retained as a historical record of a former
  API provider; there is no live API to consume.'
